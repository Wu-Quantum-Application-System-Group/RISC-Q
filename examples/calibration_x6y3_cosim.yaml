# A co-sim-scaled TWO-qubit qcal config for examples/calibration_x6y3_cosim.ipynb — the same tree
# shape as the X6Y3 config of record (examples/cal-config-x6y3.yaml), with every number scaled to the
# sim-2q build (dsp 100 MHz, batch 10 ns) the way software/tests/qcal_cosim.yaml scales qubit 0.
#
# Two qubits, one per core, sharing the converter pair: their readouts are frequency-multiplexed at
# demod codes 2048 / 1024 (12.5 / 6.25 MHz) and the model tones SUM on the shared ADC.
# The X90 amp (0.5) is deliberately UNCALIBRATED — the chain pulls it to the planted truth; the
# notebook additionally detunes each qubit's freq (±60 codes) before the first step. `herald: true`
# mirrors the X6Y3 device config: every counts-mode shot is post-selected on a pre-sequence |0> read.

single_qubit:
  0:
    GE:
      freq: 50000000.0        # F_GE — DAC freq code 2048
      T1: 6.0e-06             # 600 batches (matches the planted model's readout budget)
      T2*: 3.0e-05            # 3000 batches
      X90:
        pulse:
        - channel: Q0.qdrv
          env: virtualz
          time: 0.0
          kwargs: {phase: 0.0}
        - channel: Q0.qdrv
          env: square         # 4 batches on the gate channel == the 16-sample GATE_ENV
          time: 4.0e-08
          kwargs: {amp: 0.5, phase: 0.0}
        - channel: Q0.qdrv
          env: virtualz
          time: 0.0
          kwargs: {phase: 0.0}
      X:
        pulse:                # double-length square (the chain preps X90·X90; from_qcal needs it)
        - channel: Q0.qdrv
          env: square
          time: 8.0e-08
          kwargs: {amp: 0.495, phase: 0.0}
    EF:                       # the EF subspace (from_qcal REQUIRES it);
      freq: 450000000.0       # placeholder scale — the 1Q chain never plays it
      T1: 6.0e-06
      T2*: 3.0e-05
      X90:
        pulse:
        - channel: Q0.qdrv
          env: virtualz
          time: 0.0
          kwargs: {phase: 0.0}
        - channel: Q0.qdrv
          env: square
          time: 4.0e-08
          kwargs: {amp: 0.4, phase: 0.0}
        - channel: Q0.qdrv
          env: virtualz
          time: 0.0
          kwargs: {phase: 0.0}
      X:
        pulse:
        - channel: Q0.qdrv
          env: square
          time: 8.0e-08
          kwargs: {amp: 0.4, phase: 0.0}
  1:
    GE:
      freq: 50000000.0
      T1: 6.0e-06
      T2*: 3.0e-05
      X90:
        pulse:
        - channel: Q1.qdrv
          env: virtualz
          time: 0.0
          kwargs: {phase: 0.0}
        - channel: Q1.qdrv
          env: square
          time: 4.0e-08
          kwargs: {amp: 0.5, phase: 0.0}
        - channel: Q1.qdrv
          env: virtualz
          time: 0.0
          kwargs: {phase: 0.0}
      X:
        pulse:
        - channel: Q1.qdrv
          env: square
          time: 8.0e-08
          kwargs: {amp: 0.495, phase: 0.0}

    EF:                       # the EF subspace (from_qcal REQUIRES it);
      freq: 650000000.0       # placeholder scale — the 1Q chain never plays it
      T1: 6.0e-06
      T2*: 3.0e-05
      X90:
        pulse:
        - channel: Q1.qdrv
          env: virtualz
          time: 0.0
          kwargs: {phase: 0.0}
        - channel: Q1.qdrv
          env: square
          time: 4.0e-08
          kwargs: {amp: 0.4, phase: 0.0}
        - channel: Q1.qdrv
          env: virtualz
          time: 0.0
          kwargs: {phase: 0.0}
      X:
        pulse:
        - channel: Q1.qdrv
          env: square
          time: 8.0e-08
          kwargs: {amp: 0.4, phase: 0.0}
readout:
  0:
    channel: 0
    freq: 12500000.0          # demod_code_to_freq(2048) — core 0's multiplex slot
    amp: 0.5
    time: 5.6e-07             # 56-batch drive (covers the 40-batch window + SEP)
    env: square
    kwargs: {}
    demod:
      delay: 0.0              # the ADC round trip is 0 in co-sim
      phase: 0.0              # degrees; ReadoutCalibration measures and overwrites this
      time: 4.0e-07           # 40-batch integration window
      env: square
      kwargs: {amp: 1.0}
  1:
    channel: 1
    freq: 6250000.0           # demod_code_to_freq(1024) — core 1's multiplex slot
    amp: 0.5
    time: 5.6e-07
    env: square
    kwargs: {}
    demod:
      delay: 0.0
      phase: 0.0
      time: 4.0e-07
      env: square
      kwargs: {amp: 1.0}
  herald: true                # the X6Y3 device runs heralded readout — so does this chain

reset:
  passive:
    enable: true
    delay: 3.2e-05            # 3200-batch relax head ≫ T1 (the readout-classifier budget)

hardware:
  sample_rate: {DAC: 1600000000.0, ADC: 400000000.0}
  interpolation_ratio: {qdrv: 4, rdrv: 16, rdlo: 4}
